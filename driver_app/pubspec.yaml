name: driver_app
description: "Food delivery driver app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.0.7
  shared_preferences: ^2.3.2
  firebase_core: ^4.7.0
  cloud_firestore: ^6.3.0
  firebase_messaging: ^16.2.0
  device_info_plus: ^12.4.0
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/branding/driver-app-centered.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/driver-app-centered.png
  adaptive_icon_background: "#FFF7ED"
  adaptive_icon_foreground: assets/branding/driver-app-centered.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FFF7ED"
  image: assets/branding/driver-app-centered.png
  android: true
  ios: true
  web: false
  android_gravity: center
  ios_content_mode: scaleAspectFit
  fullscreen: true
  android_12:
    color: "#FFF7ED"
    image: assets/branding/driver-app-centered.png
